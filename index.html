<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Digit Match Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0e1117; color: #fff; padding: 15px; margin: 0; }
        h2 { color: #ff444f; font-size: 20px; text-align: center; }
        .card { background: #1f242d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #aaa; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #2b323c; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #ff444f; color: white; border: none; padding: 12px; margin-top: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #e03b44; }
        .log-box { background: #000; padding: 10px; font-family: monospace; font-size: 12px; height: 180px; overflow-y: scroll; border-radius: 4px; border: 1px solid #333; }
        .signal { background: #1b3b2b; border-left: 4px solid #2ecc71; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Deriv 2-Tick Digit Matcher</h2>

    <div class="card">
        <label>Deriv API Token (Real/Demo)</label>
        <input type="password" id="apiToken" placeholder="Paste your token here">

        <label>Select Market Symbol</label>
        <select id="symbol">
            <option value="R_100">Volatility 100 Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="1HZ100V">1-Second Volatility 100</option>
        </select>

        <label>Stake Amount (USD)</label>
        <input type="number" id="stake" value="1.00" step="0.5">

        <button onclick="toggleBot()">Connect & Start Analyzer</button>
    </div>

    <div class="card">
        <h3>Live Analysis & Signals</h3>
        <div id="signalArea">Status: Disconnected</div>
        <br>
        <div class="log-box" id="logBox">Logs will appear here...</div>
    </div>

<script>
let ws;
let recentDigits = [];
const SAMPLE_SIZE = 100;
let isRunning = false;

function log(msg) {
    const box = document.getElementById('logBox');
    box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
}

function toggleBot() {
    if (isRunning) {
        if(ws) ws.close();
        isRunning = false;
        document.querySelector('button').innerText = "Connect & Start Analyzer";
        log("Stopped by user.");
        return;
    }

    const token = document.getElementById('apiToken').value.trim();
    const symbol = document.getElementById('symbol').value;
    if (!token) { alert("Please insert your API token."); return; }

    isRunning = true;
    document.querySelector('button').innerText = "Disconnect / Stop";
    log("Connecting to Deriv WebSocket...");

    // App ID 1089 is public demo/testing; swap with your own registered app ID if needed
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=1089`);

    ws.onopen = () => {
        log("Connected. Authorizing account...");
        ws.send(JSON.stringify({ authorize: token }));
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (data.msg_type === 'authorize') {
            if (data.error) {
                alert("Auth failed: " + data.error.message);
                toggleBot();
                return;
            }
            log(`Authorized successfully! Account: ${data.authorize.email}`);
            log(`Subscribing to ticks for ${symbol}...`);
            ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
        }

        if (data.msg_type === 'tick') {
            const quote = String(data.tick.quote);
            const lastDigit = parseInt(quote.slice(-1));
            recentDigits.push(lastDigit);

            if (recentDigits.length > SAMPLE_SIZE) recentDigits.shift();

            if (recentDigits.length === SAMPLE_SIZE) {
                let counts = Array(10).fill(0);
                recentDigits.forEach(d => counts[d]++);

                // Find hottest digit
                let maxCount = Math.max(...counts);
                let hotDigit = counts.indexOf(maxCount);
                let percentage = (maxCount / SAMPLE_SIZE) * 100;

                document.getElementById('signalArea').innerHTML = `
                    Latest Tick Quote: <b>${quote}</b> (Digit: <b>${lastDigit}</b>)<br>
                    Hottest Current Digit: <b>${hotDigit}</b> at <b>${percentage.toFixed(1)}%</b>
                `;

                // Single execution condition (> 13% frequency)
                if (percentage >= 13.0) {
                    log(`>>> SIGNAL: Digit ${hotDigit} is hot (${percentage}%). Executing 2-tick Match!`);
                    executeMatchTrade(symbol, hotDigit, parseFloat(document.getElementById('stake').value));
                    
                    // Stop stream temporarily to enforce single execution rule without Martingale
                    toggleBot(); 
                }
            }
        }
    };
}

function executeMatchTrade(symbol, predictionDigit, stake) {
    const proposalReq = {
        proposal: 1,
        amount: stake,
        basis: "stake",
        currency: "USD",
        duration: 2,
        duration_unit: "t",
        symbol: symbol,
        contract_type: "DIGITMATCH",
        barrier: String(predictionDigit)
    };
    
    // Send proposal request (In full production, handle 'proposal' response with a 'buy' request)
    log(`Sending trade proposal for Match Digit ${predictionDigit} with $${stake}...`);
    ws.send(JSON.stringify(proposalReq));
}
</script>

</body>
</html>
