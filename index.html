<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kipyegon's Automated Digit Intelligence Suite</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-blue: #3b82f6;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); padding: 15px; margin: 0; }
        h2 { color: var(--accent-blue); font-size: 18px; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .welcome-banner { text-align: center; font-size: 15px; color: var(--gold); font-weight: bold; margin-bottom: 15px; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        label { display: block; margin-top: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; margin-top: 6px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        .btn-group { display: flex; gap: 12px; margin-top: 15px; }
        button { flex: 1; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; font-size: 14px; }
        .btn-start { background: var(--success-green); color: #fff; }
        .btn-stop { background: var(--danger-red); color: #fff; }
        .btn-login { background: var(--accent-blue); color: #fff; margin-top: 8px; }
        
        .ranking-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .rank-item { background: #1e293b; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .rank-item.hot { border-color: var(--success-green); background: #064e3b33; }
        .digit-num { font-size: 18px; font-weight: bold; color: var(--text-main); }
        .digit-pct { font-size: 14px; color: var(--gold); font-weight: bold; }
        
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #334155; color: #fff; }
        .log-box { background: #070a12; padding: 10px; font-family: monospace; font-size: 11px; height: 120px; overflow-y: scroll; border-radius: 8px; border: 1px solid #1e293b; color: #38bdf8; margin-top: 10px;}
        .stats-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 8px; color: var(--text-muted); }
    </style>
</head>
<body>

    <h2>Automated Digit Terminal</h2>
    <div class="welcome-banner" id="welcomeBanner">Welcome Kipyegon! Today we print more dollars! 💵</div>

    <!-- Auth Card -->
    <div class="card" id="authCard">
        <label>Deriv API Token (Trade Permission)</label>
        <input type="password" id="apiToken" placeholder="Paste your API token here...">
        <button class="btn-login" onclick="initSession()">Authorize & Connect Account</button>
    </div>

    <!-- Main Dashboard (Hidden until authorized) -->
    <div class="card" id="dashboardCard" style="display:none;">
        <label>Select Automated Market Feed</label>
        <select id="symbol">
            <option value="R_100">Volatility 100 Index</option>
            <option value="R_75">Volatility 75 Index</option>
            <option value="R_50">Volatility 50 Index</option>
            <option value="R_25">Volatility 25 Index</option>
            <option value="R_10">Volatility 10 Index</option>
            <option value="1HZ100V">1-Second Volatility 100</option>
            <option value="1HZ50V">1-Second Volatility 50</option>
        </select>

        <div class="stats-row">
            <span>Account Balance: <strong id="accBalance" style="color:#fff;">$0.00</strong></span>
            <span>Current Stake: <strong id="currentStakeDisplay" style="color:var(--gold);">$0.25</strong></span>
        </div>

        <div class="btn-group">
            <button class="btn-start" onclick="startAutomation()">Start Auto-Trading</button>
            <button class="btn-stop" onclick="stopAutomation()">Stop Engine</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            <span id="statusBadge" class="status-badge">Idle</span>
            <span id="sampleStatus" style="font-size: 12px; color: var(--text-muted);">Buffer: 0/100</span>
        </div>

        <label>Real-Time Digit Hit Rankings & Intelligence</label>
        <div class="ranking-grid" id="rankingGrid"></div>

        <div class="log-box" id="logBox">[System] Awaiting API authorization...</div>
    </div>

<script>
let ws = null;
let recentDigits = [];
const SAMPLE_SIZE = 100;
let isRunning = false;
let isTradingActive = false;

// Risk Management Variables ($0.25 base + $0.25 safe flat increment)
let baseStake = 0.25;
let currentStake = 0.25;
let lastTradeTime = 0;

function log(msg) {
    const box = document.getElementById('logBox');
    box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
}

function initSession() {
    const token = document.getElementById('apiToken').value.trim();
    if (!token) {
        alert("Please paste a valid Deriv API token.");
        return;
    }

    log("Connecting to Deriv authorized websocket...");
    ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

    ws.onopen = () => {
        ws.send(JSON.stringify({ authorize: token }));
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.msg_type === 'authorize') {
            if (data.error) {
                log(`Authorization Error: ${data.error.message}`);
                alert(`Authorization Failed: ${data.error.message}`);
            } else {
                log(`Successfully authorized account: ${data.authorize.email}`);
                document.getElementById('authCard').style.display = 'none';
                document.getElementById('dashboardCard').style.display = 'block';
                document.getElementById('accBalance').innerText = `$${parseFloat(data.authorize.balance).toFixed(2)}`;
                document.getElementById('statusBadge').innerText = "Ready";
                
                // Keep-alive balance ping
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ balance: 1 }));
                }, 30000);
            }
        }

        if (data.msg_type === 'balance') {
            document.getElementById('accBalance').innerText = `$${parseFloat(data.balance.balance).toFixed(2)}`;
        }

        if (data.msg_type === 'history' && data.history && data.history.prices) {
            recentDigits = data.history.prices.map(price => parseInt(String(price).slice(-1)));
            log(`Loaded ${recentDigits.length} historical ticks. Auto-engine online.`);
            document.getElementById('statusBadge').innerText = "Auto-Trading Active";
            document.getElementById('statusBadge').style.background = "#10b981";
            updateDashboardAndAnalyze();

            const symbol = document.getElementById('symbol').value;
            ws.send(JSON.stringify({ ticks: symbol, subscribe: 1, req_id: 2 }));
        }

        if (data.msg_type === 'tick' && data.tick) {
            const lastDigit = parseInt(String(data.tick.quote).slice(-1));
            recentDigits.push(lastDigit);
            if (recentDigits.length > SAMPLE_SIZE) recentDigits.shift();
            updateDashboardAndAnalyze();
        }

        if (data.msg_type === 'buy') {
            if (data.error) {
                log(`Trade execution error: ${data.error.message}`);
            } else {
                log(`[TRADE PLACED] Contract ID: ${data.buy.contract_id} | Stake: $${currentStake}`);
            }
        }

        if (data.msg_type === 'proposal_open_contract') {
            const contract = data.proposal_open_contract;
            if (contract && contract.is_sold) {
                if (contract.status === 'won') {
                    log(`🎉 [WON] Profit: +$${contract.profit}. Resetting stake to $0.25.`);
                    currentStake = 0.25; // Reset on win
                } else {
                    log(`❌ [LOST] Loss: -$${Math.abs(contract.profit)}. Applying safe increment.`);
                    currentStake += 0.25; // Safe flat increment progression ($0.25 -> $0.50 -> $0.75...)
                    if (currentStake > 2.00) currentStake = 0.25; // Safety cap reset protection
                }
                document.getElementById('currentStakeDisplay').innerText = `$${currentStake.toFixed(2)}`;
            }
        }
    };
}

function updateDashboardAndAnalyze() {
    if (recentDigits.length === 0) return;

    let counts = Array(10).fill(0);
    recentDigits.forEach(d => counts[d]++);

    let stats = counts.map((count, digit) => ({
        digit: digit,
        count: count,
        percentage: (count / recentDigits.length) * 100
    })).sort((a, b) => b.percentage - a.percentage);

    let gridHtml = '';
    stats.forEach((item, index) => {
        let isHot = item.percentage >= 13.5; // High conviction statistical surge threshold
        gridHtml += `
            <div class="rank-item ${isHot ? 'hot' : ''}">
                <div>
                    <span class="digit-num">#${item.digit}</span>
                    <span style="font-size:10px; color:var(--text-muted); display:block;">Rank ${index+1}</span>
                </div>
                <div class="digit-pct">${item.percentage.toFixed(1)}%</div>
            </div>
        `;
    });

    document.getElementById('rankingGrid').innerHTML = gridHtml;
    document.getElementById('sampleStatus').innerText = `Buffer Window: ${recentDigits.length}/${SAMPLE_SIZE} ticks`;

    // AUTOMATED EXECUTION TRIGGER LOGIC
    let topChoice = stats[0];
    let now = Date.now();
    
    // If auto-trading is running, top digit hits >= 13.5%, and cooldown period has passed (preventing spam trades)
    if (isTradingActive && topChoice.percentage >= 13.5 && (now - lastTradeTime > 8000)) {
        lastTradeTime = now;
        executeAutomatedTrade(topChoice.digit, topChoice.percentage);
    }
}

function executeAutomatedTrade(targetDigit, hitRate) {
    const symbol = document.getElementById('symbol').value;
    log(`🚀 [SIGNAL DETECTED] Digit ${targetDigit} surged to ${hitRate.toFixed(1)}%. Executing Digit Match...`);

    // Deriv API Buy Request Payload for Digit Match
    ws.send(JSON.stringify({
        buy: 1,
        price: currentStake,
        parameters: {
            amount: currentStake,
            basis: "stake",
            currency: "USD",
            symbol: symbol,
            duration: 1,
            duration_unit: "t", // 1-tick ultra-fast execution
            contract_type: "DIGITMATCH",
            barrier: String(targetDigit)
        }
    }));
}

function startAutomation() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("Please authorize your account first.");
        return;
    }
    const symbol = document.getElementById('symbol').value;
    recentDigits = [];
    isTradingActive = true;

    document.getElementById('statusBadge').innerText = "Syncing History";
    document.getElementById('statusBadge').style.background = "#eab308";
    log(`Fetching historical tick stream for ${symbol}...`);

    ws.send(JSON.stringify({
        ticks_history: symbol,
        adjust_start_time: 1,
        count: SAMPLE_SIZE,
        end: "latest",
        start: 1,
        style: "ticks",
        req_id: 1
    }));
}

function stopAutomation() {
    isTradingActive = false;
    document.getElementById('statusBadge').innerText = "Paused";
    document.getElementById('statusBadge').style.background = "#334155";
    log("Automated execution engine paused.");
}
</script>

</body>
</html>
